name: Test production deploy options without credentials skip deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish dir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-publish"
          echo "<h1>prod</h1>" > "$GITHUB_WORKSPACE/test-publish/index.html"
      - id: action
        uses: .
        with:
          publish-dir: ./test-publish
          production-branch: act-harness
          production-deploy: "true"
          enable-commit-status: "true"
          github-deployment-environment: production
          github-deployment-description: "Production deploy"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""
      - name: Assert step succeeded with empty deploy-url
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.deploy-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deploy-url: '$ACTUAL'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when credentials are missing"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty deploy-url without credentials"
            exit 1
          fi
          echo "PASS"
