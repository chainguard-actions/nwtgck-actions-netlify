name: Test production deploy without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with content
        run: |
          mkdir -p /tmp/publish-dir
          echo "<html><body>Production Build</body></html>" > /tmp/publish-dir/index.html
          echo "app.js content" > /tmp/publish-dir/app.js

      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          production-deploy: "true"
          production-branch: "main"
          deploy-message: "Production deploy test"
        # No credentials - should complete gracefully since fails-without-credentials defaults to false

      - name: Assert action completed
        run: |
          echo "Action completed successfully for production-deploy scenario"
          echo "PASS"
