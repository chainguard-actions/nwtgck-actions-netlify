name: Test production deploy without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with multiple files
        run: |
          mkdir -p /tmp/site/css
          echo "<h1>Production Site</h1>" > /tmp/site/index.html
          echo "body { color: red; }" > /tmp/site/css/style.css

      - id: action
        uses: .
        with:
          publish-dir: /tmp/site
          production-deploy: "true"
          deploy-message: "Production deploy test"
          fails-without-credentials: "false"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully for production-deploy scenario"
          echo "PASS"
