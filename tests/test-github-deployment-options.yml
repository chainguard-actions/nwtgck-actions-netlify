name: Test GitHub deployment options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish-dir && echo "hello" > /tmp/publish-dir/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          github-token: ${{ github.token }}
          enable-github-deployment: true
          github-deployment-environment: staging
          github-deployment-description: Test deployment from act
          fails-without-credentials: false
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with GitHub deployment options (no Netlify credentials, graceful exit)"
          echo "PASS"
