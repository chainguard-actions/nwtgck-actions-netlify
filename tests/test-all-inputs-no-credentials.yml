name: Test all optional inputs without credentials skip deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish and functions dirs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-publish" "$GITHUB_WORKSPACE/test-functions"
          echo "<h1>hello</h1>" > "$GITHUB_WORKSPACE/test-publish/index.html"
          echo "exports.handler = async () => ({ statusCode: 200 })" > "$GITHUB_WORKSPACE/test-functions/hello.js"
          printf '[build]\n  publish = "test-publish"\n' > "$GITHUB_WORKSPACE/test-netlify.toml"
      - id: action
        uses: .
        with:
          publish-dir: ./test-publish
          functions-dir: ./test-functions
          deploy-message: "test deploy with all inputs"
          github-token: ${{ github.token }}
          production-branch: main
          production-deploy: "false"
          enable-pull-request-comment: "false"
          enable-commit-comment: "false"
          enable-commit-status: "false"
          overwrites-pull-request-comment: "true"
          netlify-config-path: ./test-netlify.toml
          alias: test-alias
          github-deployment-environment: test-env
          github-deployment-description: "Test deployment description"
          fails-without-credentials: "false"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""
      - name: Assert step succeeded with empty deploy-url
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.deploy-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deploy-url: '$ACTUAL'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when credentials are missing"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty deploy-url without credentials"
            exit 1
          fi
          echo "PASS"
