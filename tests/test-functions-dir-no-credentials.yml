name: Test functions-dir input (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish and functions directories
        run: |
          mkdir -p /tmp/test-publish
          echo "<h1>Hello</h1>" > /tmp/test-publish/index.html
          mkdir -p /tmp/test-functions
          echo "exports.handler = async () => ({ statusCode: 200 });" > /tmp/test-functions/hello.js

      - id: action
        uses: .
        with:
          publish-dir: /tmp/test-publish
          functions-dir: /tmp/test-functions
          deploy-message: "Test functions-dir input"
          fails-without-credentials: "false"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (no credentials, graceful exit expected)"
          echo "PASS"
