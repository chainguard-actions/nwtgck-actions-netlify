name: Test no credentials fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p /tmp/publish-site
          echo "<html><body>Hello World</body></html>" > /tmp/publish-site/index.html

      # No NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID set, fails-without-credentials: true
      # → action should fail with an error
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-site
          fails-without-credentials: "true"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fails-without-credentials=true and no credentials provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials are missing and fails-without-credentials=true"
