name: Test no credentials graceful
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: mkdir -p /tmp/publish-dir && echo "<h1>Hello</h1>" > /tmp/publish-dir/index.html

      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          deploy-message: "Test deploy"
          fails-without-credentials: "false"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully without credentials"
          echo "PASS"
