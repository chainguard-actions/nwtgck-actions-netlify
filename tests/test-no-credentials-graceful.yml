name: Test no credentials graceful
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p /tmp/publish-site
          echo "<html><body>Hello World</body></html>" > /tmp/publish-site/index.html

      # No NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID set → credentials absent
      # fails-without-credentials defaults to false → action should succeed gracefully
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-site
          deploy-message: "Test deploy"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully (no credentials, graceful exit)"
          echo "PASS"
