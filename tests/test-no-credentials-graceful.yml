name: Test graceful no-credentials behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: mkdir -p /tmp/publish-dir && echo "hello" > /tmp/publish-dir/index.html

      - name: Run action without credentials (should not fail)
        id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          fails-without-credentials: 'false'
          deploy-message: 'Test deploy without credentials'
        continue-on-error: true

      - name: Assert action did not fail
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: expected action to succeed (or skip) when fails-without-credentials=false, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action did not fail without credentials when fails-without-credentials=false"
