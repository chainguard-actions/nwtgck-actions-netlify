name: Test pull request scenario without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p /tmp/publish-dir
          echo "<html><body>PR Preview</body></html>" > /tmp/publish-dir/index.html

      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          deploy-message: "PR preview deploy"
          enable-pull-request-comment: "false"
          enable-commit-comment: "false"
          enable-commit-status: "false"
          alias: "pr-1"
        # No credentials - should complete gracefully since fails-without-credentials defaults to false

      - name: Assert action completed
        run: |
          echo "Action completed successfully for pull request scenario"
          echo "PASS"
