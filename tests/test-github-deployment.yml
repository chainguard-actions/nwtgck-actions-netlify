name: Test GitHub deployment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish && echo "hello" > /tmp/publish/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish
          enable-github-deployment: "true"
          github-deployment-environment: "staging"
          github-deployment-description: "Test deployment from act"
          fails-without-credentials: "false"
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
