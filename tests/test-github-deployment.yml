name: Test GitHub deployment options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish && echo "<h1>Deployment</h1>" > /tmp/publish/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish
          enable-github-deployment: "true"
          github-deployment-environment: "staging"
          github-deployment-description: "Test deployment from CI"
          github-token: "fake-token-for-testing"
          fails-without-credentials: "false"
        continue-on-error: true
      - name: Assert action ran without hard failure
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed with GitHub deployment inputs accepted"
