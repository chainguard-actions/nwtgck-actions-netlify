name: Test github-token input (no Netlify credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p /tmp/test-publish
          echo "<h1>Hello</h1>" > /tmp/test-publish/index.html

      - id: action
        uses: .
        with:
          publish-dir: /tmp/test-publish
          github-token: ${{ github.token }}
          deploy-message: "Test github-token input"
          fails-without-credentials: "false"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with github-token provided (no Netlify credentials, graceful exit expected)"
          echo "PASS"
