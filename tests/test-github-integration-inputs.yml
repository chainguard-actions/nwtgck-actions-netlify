name: Test GitHub integration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish-dir && echo "hello" > /tmp/publish-dir/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          github-token: ${{ github.token }}
          enable-pull-request-comment: "false"
          enable-commit-comment: "false"
          enable-commit-status: "false"
          overwrites-pull-request-comment: "false"
          fails-without-credentials: "false"
      - name: Assert action completed
        run: |
          echo "Action completed without error"
          echo "PASS"
