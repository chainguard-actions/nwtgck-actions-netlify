name: Test netlify-config-path input (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory and netlify.toml
        run: |
          mkdir -p /tmp/test-publish
          echo "<h1>Hello</h1>" > /tmp/test-publish/index.html
          cat > /tmp/netlify.toml <<'EOF'
          [build]
            publish = "dist"
          EOF

      - id: action
        uses: .
        with:
          publish-dir: /tmp/test-publish
          netlify-config-path: /tmp/netlify.toml
          deploy-message: "Test netlify-config-path input"
          fails-without-credentials: "false"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with netlify-config-path provided (no Netlify credentials, graceful exit expected)"
          echo "PASS"
