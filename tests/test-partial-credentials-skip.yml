name: Test partial credentials skips deploy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish dir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-publish"
          echo "<h1>hello</h1>" > "$GITHUB_WORKSPACE/test-publish/index.html"
      - id: action
        uses: .
        with:
          publish-dir: ./test-publish
          fails-without-credentials: "false"
          enable-commit-comment: "false"
          enable-pull-request-comment: "false"
        env:
          NETLIFY_AUTH_TOKEN: "only-token-no-site-id"
          NETLIFY_SITE_ID: ""
      - name: Assert step succeeded with empty deploy-url
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.deploy-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deploy-url: '$ACTUAL'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (skip) when site id is missing"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty deploy-url"
            exit 1
          fi
          echo "PASS"
