name: Test GitHub integration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish-dir && echo "<h1>Hello</h1>" > /tmp/publish-dir/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          github-token: "fake-token-for-testing"
          enable-pull-request-comment: "true"
          overwrites-pull-request-comment: "true"
          enable-commit-comment: "true"
          enable-commit-status: "true"
          fails-without-credentials: "false"
        continue-on-error: true
      - name: Assert action ran without crashing unexpectedly
        run: |
          echo "Action completed (with or without credentials)"
          echo "PASS"
