name: Test pull request options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish && echo "<h1>PR Preview</h1>" > /tmp/publish/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish
          github-token: "fake-token-for-testing"
          enable-pull-request-comment: "true"
          overwrites-pull-request-comment: "true"
          alias: pr-preview
          fails-without-credentials: "false"
        continue-on-error: true
      - name: Assert action ran without hard failure
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed with pull request inputs accepted"
