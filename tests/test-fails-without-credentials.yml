name: Test fails-without-credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish dir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-publish"
          echo "<h1>hello</h1>" > "$GITHUB_WORKSPACE/test-publish/index.html"
      - id: action
        uses: .
        continue-on-error: true
        with:
          publish-dir: ./test-publish
          fails-without-credentials: "true"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.deploy-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deploy-url: '$ACTUAL'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when fails-without-credentials=true and no credentials"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty deploy-url"
            exit 1
          fi
          echo "PASS"
