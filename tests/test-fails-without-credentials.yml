name: Test fails without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: mkdir -p /tmp/publish-dir && echo "<h1>Hello</h1>" > /tmp/publish-dir/index.html

      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          fails-without-credentials: "true"
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when fails-without-credentials=true and no credentials provided, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without credentials"
