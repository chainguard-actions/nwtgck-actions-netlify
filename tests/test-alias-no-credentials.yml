name: Test alias input without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p /tmp/alias-site
          echo "<h1>Alias Test</h1>" > /tmp/alias-site/index.html

      - id: action
        uses: .
        with:
          publish-dir: /tmp/alias-site
          alias: "my-preview-alias"
          deploy-message: "Alias deploy test"
          fails-without-credentials: "false"
        env:
          NETLIFY_AUTH_TOKEN: ""
          NETLIFY_SITE_ID: ""

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully for alias scenario"
          echo "PASS"
