name: Test basic usage - publish-dir and deploy-message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish-dir && echo "<h1>Hello</h1>" > /tmp/publish-dir/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish-dir
          deploy-message: "Test deploy from act"
          fails-without-credentials: "false"
        continue-on-error: true
      - name: Assert action ran without crashing unexpectedly
        run: |
          echo "Action completed (with or without credentials)"
          echo "PASS"
