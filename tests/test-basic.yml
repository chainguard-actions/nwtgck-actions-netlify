name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p /tmp/publish && echo "hello" > /tmp/publish/index.html
      - id: action
        uses: .
        with:
          publish-dir: /tmp/publish
          deploy-message: "Test deploy message"
          production-deploy: "false"
          fails-without-credentials: "false"
        continue-on-error: true
      - name: Assert action ran without crashing on missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fails-without-credentials=false, the action should not hard-fail
          # It may succeed or fail gracefully; we just verify it ran
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
